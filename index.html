<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wartungsarbeiten — ByteSoft</title>
<link rel="icon" type="image/png" href="ByteSoft_B.png" />
<link rel="apple-touch-icon" href="ByteSoft_B.png" />
<style>
  :root {
    --bg: #0f1117;
    --surface: #171922;
    --border: #252837;
    --text: #e5e7eb;
    --muted: #9ca3af;
    --ease: cubic-bezier(.22,1,.36,1);
    --radius: 16px;
  }
  * {
    box-sizing: border-box; margin: 0; padding: 0;
    user-select: none; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none;
  }
  img, svg {
    -webkit-user-drag: none;
    user-drag: none;
    pointer-events: none;
  }
  body {
    font-family: Inter, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    overflow-x: hidden;
    position: relative;
  }
  /* Animated Background */
  .bg-grid {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image: radial-gradient(circle, rgba(59,130,246,.12) 1px, transparent 1px);
    background-size: 28px 28px;
    animation: gridPan 15s linear infinite;
    mask-image: radial-gradient(ellipse 80% 70% at 50% 40%, black 30%, transparent 75%);
  }
  @keyframes gridPan {
    from { background-position: 0 0; }
    to { background-position: 56px 84px; }
  }
  .blob { position: fixed; border-radius: 50%; filter: blur(110px); pointer-events: none; z-index: 0; }
  .blob-1 { width: 460px; height: 460px; background: #2563eb; opacity: .24; top: -140px; left: -140px; animation: drift1 5s var(--ease) infinite alternate; }
  .blob-2 { width: 400px; height: 400px; background: #3b82f6; opacity: .15; bottom: -160px; right: -120px; animation: drift2 6s var(--ease) infinite alternate; }
  .blob-3 { width: 320px; height: 320px; background: #1e40af; opacity: .2; top: 35%; left: 55%; animation: drift1 7s var(--ease) infinite alternate-reverse; }
  .blob-4 { width: 260px; height: 260px; background: #60a5fa; opacity: .1; top: 60%; left: 10%; animation: drift2 5.5s var(--ease) infinite alternate-reverse; }
  @keyframes drift1 {
    0% { transform: translate(0,0) scale(1); }
    50% { transform: translate(60px,40px) scale(1.1); }
    100% { transform: translate(-20px,70px) scale(1.05); }
  }
  @keyframes drift2 {
    0% { transform: translate(0,0) scale(1.05); }
    50% { transform: translate(-50px,-30px) scale(1); }
    100% { transform: translate(30px,-60px) scale(1.12); }
  }

  .wrap { width: 100%; max-width: 440px; position: relative; z-index: 1; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px 28px 24px;
    box-shadow: 0 8px 24px rgba(0,0,0,.35);
    animation: entry .6s var(--ease) both;
  }
  @keyframes entry {
    from { opacity: 0; transform: translateY(12px) scale(.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .row-anim { animation: entry .6s var(--ease) both; }
  .d1 { animation-delay: .08s; }

  .profile { display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 6px; }
  .main-logo {
    width: 100%;
    max-width: 240px;
    height: auto;
    object-fit: contain;
    margin-bottom: 20px;
    display: block;
    filter: drop-shadow(0 4px 16px rgba(0,0,0,.4));
  }

  h1 { font-size: 24px; font-weight: 650; letter-spacing: -.02em; margin-bottom: 6px; text-align: center; }

  .footer {
    margin-top: 20px; padding-top: 16px;
    border-top: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; gap: 6px;
    font-size: 13px; color: var(--muted);
  }
  .heart {
    width: 15px; height: 15px; fill: #f87171;
    animation: beatSoft 2s var(--ease) infinite;
    transform-origin: center;
  }
  @keyframes beatSoft {
    0%, 100% { transform: scale(1); opacity: 1; }
    30% { transform: scale(1.18); opacity: .9; }
    50% { transform: scale(1); }
  }

  @media (max-width: 900px) {
    .wrap { max-width: 100%; }
  }
  @media (max-width: 480px) {
    body { padding: 20px 12px; align-items: flex-start; }
    .card { padding: 24px 18px 18px; }
    .blob { filter: blur(80px); opacity: .12; animation: none; }
    .bg-grid { animation: none; }
    h1 { font-size: 21px; }
  }
</style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
  <div class="blob blob-4"></div>

  <main class="wrap">
    <div class="card">
      <div class="profile row-anim">
        <img class="main-logo" src="ByteSoft.png" alt="ByteSoft Logo" draggable="false" ondragstart="return false" />
        <h1>Wir befinden uns momentan in Wartungsarbeiten!</h1>
      </div>

      <div class="footer row-anim d1">
        Made with Love
        <svg class="heart" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      </div>
    </div>
  </main>
<script>
  // Kein Markieren / Draggen / Strg+A etc.
  document.addEventListener("selectstart", function (e) { e.preventDefault(); });
  document.addEventListener("dragstart", function (e) { e.preventDefault(); });
  document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  document.addEventListener("keydown", function (e) {
    var k = (e.key || "").toLowerCase();
    if ((e.ctrlKey || e.metaKey) && ["a", "c", "x", "s", "u", "p"].indexOf(k) !== -1) {
      e.preventDefault();
    }
  });
</script>
</body>
</html>
