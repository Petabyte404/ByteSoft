<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Made by Petabyte! — Petabyte404</title>
<link rel="icon" type="image/svg+xml" href="pinguin.svg" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<style>
  :root {
    --primary: #3b82f6;
    --primary-dark: #2563eb;
    --primary-light: #60a5fa;
    --bg: #0f1117;
    --surface: #171922;
    --surface-2: #1c1f2b;
    --border: #252837;
    --text: #e5e7eb;
    --muted: #9ca3af;
    --ease: cubic-bezier(.22,1,.36,1);
    --radius: 16px;
  }
  * {
    box-sizing: border-box; margin: 0; padding: 0;
    user-select: none; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none;
  }
  img, svg {
    -webkit-user-drag: none;
    user-drag: none;
    pointer-events: none;
  }
  a, button { pointer-events: auto; }
  a *, button * { pointer-events: none; }
  body {
    font-family: Inter, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    overflow-x: hidden;
    position: relative;
  }
  /* Animated Background */
  .bg-grid {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image: radial-gradient(circle, rgba(59,130,246,.12) 1px, transparent 1px);
    background-size: 28px 28px;
    animation: gridPan 22s linear infinite;
    mask-image: radial-gradient(ellipse 80% 70% at 50% 40%, black 30%, transparent 75%);
  }
  @keyframes gridPan {
    from { background-position: 0 0; }
    to { background-position: 56px 84px; }
  }
  .blob { position: fixed; border-radius: 50%; filter: blur(110px); pointer-events: none; z-index: 0; }
  .blob-1 { width: 460px; height: 460px; background: #2563eb; opacity: .24; top: -140px; left: -140px; animation: drift1 14s var(--ease) infinite alternate; }
  .blob-2 { width: 400px; height: 400px; background: #3b82f6; opacity: .15; bottom: -160px; right: -120px; animation: drift2 18s var(--ease) infinite alternate; }
  .blob-3 { width: 320px; height: 320px; background: #1e40af; opacity: .2; top: 35%; left: 55%; animation: drift1 20s var(--ease) infinite alternate-reverse; }
  .blob-4 { width: 260px; height: 260px; background: #60a5fa; opacity: .1; top: 60%; left: 10%; animation: drift2 16s var(--ease) infinite alternate-reverse; }
  @keyframes drift1 {
    0% { transform: translate(0,0) scale(1); }
    50% { transform: translate(60px,40px) scale(1.1); }
    100% { transform: translate(-20px,70px) scale(1.05); }
  }
  @keyframes drift2 {
    0% { transform: translate(0,0) scale(1.05); }
    50% { transform: translate(-50px,-30px) scale(1); }
    100% { transform: translate(30px,-60px) scale(1.12); }
  }

  .wrap { width: 100%; max-width: 440px; position: relative; z-index: 1; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px 28px 24px;
    box-shadow: 0 8px 24px rgba(0,0,0,.35);
    animation: entry .6s var(--ease) both;
  }
  @keyframes entry {
    from { opacity: 0; transform: translateY(12px) scale(.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .row-anim { animation: entry .6s var(--ease) both; }
  .d1 { animation-delay: .08s; } .d2 { animation-delay: .16s; } .d3 { animation-delay: .24s; } .d4 { animation-delay: .32s; }

  .profile { display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 22px; }
  .avatar {
    width: 88px; height: 88px; border-radius: 50%;
    object-fit: cover;
    border: 2px solid var(--border);
    outline: 2px solid rgba(59,130,246,.4);
    outline-offset: 3px;
    margin-bottom: 14px;
    background: var(--surface-2);
    display: block;
  }

  h1 { font-size: 24px; font-weight: 650; letter-spacing: -.02em; margin-bottom: 6px; text-align: center; }
  p.sub { font-size: 14px; color: var(--muted); line-height: 1.5; margin-bottom: 22px; text-align: center; }

  .label { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
  .label.mt { margin-top: 18px; }

  .discord-btn {
    width: 100%;
    display: flex; align-items: center; gap: 12px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px 14px;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
    transition: transform .25s var(--ease), border-color .25s var(--ease), background .25s var(--ease);
  }
  .discord-btn:hover { transform: translateY(-2px); border-color: rgba(59,130,246,.55); background: #202334; }
  .discord-btn:active { transform: scale(.99); }
  .discord-btn .meta { flex: 1; }
  .copy-pill {
    font-size: 12px; font-weight: 600;
    color: var(--primary-light);
    background: rgba(59,130,246,.12);
    border: 1px solid rgba(59,130,246,.3);
    padding: 5px 10px; border-radius: 999px;
    transition: background .25s var(--ease), color .25s var(--ease);
    white-space: nowrap;
  }
  .discord-btn.copied .copy-pill { color: #4ade80; background: rgba(34,197,94,.12); border-color: rgba(34,197,94,.35); }

  .socials { display: grid; gap: 10px; }
  a.social {
    display: flex; align-items: center; gap: 12px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px 14px;
    text-decoration: none; color: var(--text);
    transition: transform .25s var(--ease), border-color .25s var(--ease), background .25s var(--ease);
  }
  a.social:hover {
    transform: translateY(-2px);
    border-color: rgba(59,130,246,.55);
    background: #202334;
  }
  a.social:active { transform: scale(.99); }
  .icon {
    width: 36px; height: 36px; border-radius: 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .icon svg { width: 18px; height: 18px; fill: var(--muted); transition: fill .25s var(--ease); }
  a.social:hover .icon svg { fill: var(--text); }
  .meta { display: flex; flex-direction: column; text-align: left; }
  .meta strong { font-size: 14px; font-weight: 600; }
  .meta span { font-size: 12px; color: var(--muted); }
  .arrow { margin-left: auto; color: var(--muted); font-size: 16px; transition: transform .25s var(--ease), color .25s var(--ease); }
  a.social:hover .arrow { transform: translateX(2px); color: var(--primary-light); }

  .footer {
    margin-top: 20px; padding-top: 16px;
    border-top: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; gap: 6px;
    font-size: 13px; color: var(--muted);
  }
  .heart {
    width: 15px; height: 15px; fill: #f87171;
    animation: beatSoft 2s var(--ease) infinite;
    transform-origin: center;
  }
  @keyframes beatSoft {
    0%, 100% { transform: scale(1); opacity: 1; }
    30% { transform: scale(1.18); opacity: .9; }
    50% { transform: scale(1); }
  }

  @media (max-width: 900px) {
    .wrap { max-width: 100%; }
  }
  @media (max-width: 480px) {
    body { padding: 20px 12px; align-items: flex-start; }
    .card { padding: 24px 18px 18px; }
    .blob { filter: blur(80px); opacity: .12; animation: none; }
    .bg-grid { animation: none; }
    h1 { font-size: 21px; }
  }
</style>
</head>
<body>

        <span class="icon">
          <svg viewBox="0 0 24 24"><path d="M20.32 4.37a19.8 19.8 0 0 0-4.93-1.51 13.78 13.78 0 0 0-.64 1.28 18.27 18.27 0 0 0-5.5 0 13.78 13.78 0 0 0-.64-1.28c-1.71.29-3.37.8-4.93 1.51A20.3 20.3 0 0 0 .1 18.06a19.9 19.9 0 0 0 6.07 3.03c.49-.66.93-1.37 1.3-2.1a12.9 12.9 0 0 1-2.05-.98c.17-.12.34-.25.5-.38a14.2 14.2 0 0 0 12.16 0c.16.13.33.26.5.38-.65.38-1.34.72-2.05.98.37.73.81 1.44 1.3 2.1a19.84 19.84 0 0 0 6.07-3.03 20.26 20.26 0 0 0-3.58-13.69zM8.02 15.33c-1.18 0-2.16-1.08-2.16-2.42s.95-2.42 2.16-2.42 2.18 1.09 2.16 2.42c0 1.34-.95 2.42-2.16 2.42zm7.96 0c-1.18 0-2.16-1.08-2.16-2.42s.95-2.42 2.16-2.42 2.18 1.09 2.16 2.42c0 1.34-.95 2.42-2.16 2.42z"/></svg>

  </main>
<script>
  // Kein Markieren / Draggen / Strg+A etc.
  document.addEventListener("selectstart", function (e) { e.preventDefault(); });
  document.addEventListener("dragstart", function (e) { e.preventDefault(); });
  document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  document.addEventListener("keydown", function (e) {
    var k = (e.key || "").toLowerCase();
    if ((e.ctrlKey || e.metaKey) && ["a", "c", "x", "s", "u", "p"].indexOf(k) !== -1) {
      e.preventDefault();
    }
  });

  function copyDiscord() {
    var name = "Petabyte404";
    var btn = document.getElementById("discordBtn");
    var pill = document.getElementById("copyPill");
    function done() {
      btn.classList.add("copied");
      pill.textContent = "Kopiert!";
      setTimeout(function () {
        btn.classList.remove("copied");
        pill.textContent = "Copy";
      }, 1600);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(name).then(done).catch(function () { fallback(); });
    } else { fallback(); }
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = name;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
      done();
    }
  }
</script>

</html>
